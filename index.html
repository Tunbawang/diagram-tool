<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図示ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; padding: 1rem; background: #fff; color: #111; }
.section-label { font-size: 13px; color: #666; margin-bottom: 6px; }
#input-area { display: flex; gap: 8px; margin-bottom: 1.5rem; }
#text-input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: vertical; min-height: 60px; }
#parse-btn { padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; align-self: flex-start; }
.pool-label { font-size: 12px; color: #666; margin-bottom: 4px; }
.token-pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: #f5f5f5; margin-bottom: 0.5rem; }
.hint { font-size: 12px; color: #999; margin-bottom: 0.75rem; margin-top: 4px; }
.token, .cell-token { padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; cursor: pointer; user-select: none; display: inline-block; touch-action: manipulation; }
.token.selected, .cell-token.selected { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
.token.dragging, .cell-token.dragging { opacity: 0.3; }
.action-bar { min-height: 32px; display: flex; align-items: center; gap: 6px; margin-bottom: 0.75rem; flex-wrap: wrap; }
.action-btn { padding: 3px 10px; border: 1px solid #93c5fd; border-radius: 6px; background: #dbeafe; color: #1d4ed8; font-size: 12px; cursor: pointer; display: none; }
.action-btn.visible { display: inline-block; }
.move-group { display: none; gap: 4px; align-items: center; }
.move-group.visible { display: flex; }
.move-btn { padding: 3px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; cursor: pointer; background: #fff; }
#sel-count { font-size: 12px; color: #666; }
.diagram-wrap { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 12px; font-weight: 500; color: #666; padding: 6px 12px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
th.left-col { text-align: right; width: 50%; border-right: 1px solid #ddd; }
th.right-col { text-align: left; }
td { padding: 0; }
td.left-col { border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; }
td.right-col { border-bottom: 1px solid #ddd; }
tr:last-child td { border-bottom: none; }
.cell-inner { min-height: 44px; padding: 4px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.left-col .cell-inner { justify-content: flex-end; }
.right-col .cell-inner { justify-content: flex-start; }
.cell-inner.drag-over { background: #dbeafe; }
.row-controls { display: flex; gap: 6px; flex-wrap: wrap; }
.ctrl-btn { padding: 5px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; cursor: pointer; background: #fff; }
.ctx-btn { padding: 5px 12px; border: 1px solid #93c5fd; border-radius: 6px; background: #dbeafe; color: #1d4ed8; font-size: 13px; cursor: pointer; display: none; }
.ctx-btn.visible { display: inline-block; }
.clear-btn { padding: 5px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; cursor: pointer; background: #fff; color: #666; margin-left: auto; }
</style>
</head>
<body>
<p class="section-label">英文を入力して「分解」を押してください</p>
<div id="input-area">
  <textarea id="text-input" placeholder="例: Trump accuses Starmer of seeking to join wars after we've already won"></textarea>
  <button id="parse-btn">分解</button>
</div>
<p class="pool-label">語のプール</p>
<div class="token-pool" id="token-pool"></div>
<p class="hint">タップ／クリックで選択・再タップで解除。選択後にセルをタップで配置。セル内の語を長押しでプールに戻す。セル内の語を選択すると行の挿入・削除が可能。</p>
<div class="action-bar">
  <span id="sel-count"></span>
  <div class="move-group" id="move-group">
    <button class="move-btn" id="move-up">↑</button>
    <button class="move-btn" id="move-down">↓</button>
    <button class="move-btn" id="move-left">←</button>
    <button class="move-btn" id="move-right">→</button>
  </div>
  <button class="action-btn" id="return-btn">プールに戻す</button>
  <button class="action-btn" id="desel-btn">選択解除</button>
</div>
<div class="diagram-wrap">
  <table>
    <thead><tr><th class="left-col">Operation（左列）</th><th class="right-col">Entity（右列）</th></tr></thead>
    <tbody id="diagram-body"></tbody>
  </table>
</div>
<div class="row-controls">
  <button class="ctrl-btn" id="add-row-end">＋ 末尾に行を追加</button>
  <button class="ctx-btn" id="insert-row-above">↑ この行の上に挿入</button>
  <button class="ctx-btn" id="delete-row">✕ この行を削除</button>
  <button class="ctrl-btn" id="tsv-copy">TSV コピー</button>
  <button class="clear-btn" id="clear-all">リセット</button>
</div>

<script>
let selected = [], dragItems = [], rowCount = 8, longPressTimer = null;

function getRows() { return Array.from(document.getElementById('diagram-body').rows); }

function getCellInner(ri, col) {
  const rows = getRows();
  if (ri < 0 || ri >= rows.length) return null;
  return rows[ri].cells[col === 'left' ? 0 : 1].querySelector('.cell-inner');
}

function getTokenLoc(el) {
  const inner = el.closest('.cell-inner');
  if (!inner) return null;
  const td = inner.closest('td');
  const tr = td.closest('tr');
  return { rowIdx: getRows().indexOf(tr), col: td.classList.contains('left-col') ? 'left' : 'right', inner, tr };
}

function getSelRowIdx() {
  const first = selected.find(s => s.el.classList.contains('cell-token'));
  if (!first) return -1;
  const loc = getTokenLoc(first.el);
  return loc ? loc.rowIdx : -1;
}

function updateUI() {
  const n = selected.length;
  document.getElementById('sel-count').textContent = n > 0 ? n + '語選択中' : '';
  document.getElementById('return-btn').classList.toggle('visible', n > 0);
  document.getElementById('desel-btn').classList.toggle('visible', n > 0);
  const inCell = n > 0 && selected.every(s => s.el.classList.contains('cell-token'));
  document.getElementById('move-group').classList.toggle('visible', inCell);
  document.getElementById('insert-row-above').classList.toggle('visible', inCell);
  document.getElementById('delete-row').classList.toggle('visible', inCell);
}

function clearSel() {
  selected.forEach(s => s.el.classList.remove('selected'));
  selected = []; updateUI();
}

function toggleSel(el, word) {
  const idx = selected.findIndex(s => s.el === el);
  if (idx >= 0) { el.classList.remove('selected'); selected.splice(idx, 1); }
  else { el.classList.add('selected'); selected.push({ el, word }); }
  updateUI();
}

function addToPool(word) {
  const t = document.createElement('span');
  t.className = 'token'; t.textContent = word; t.dataset.word = word; t.draggable = true;
  t.addEventListener('click', e => { e.stopPropagation(); toggleSel(t, word); });
  t.addEventListener('dragstart', e => {
    dragItems = selected.length && selected.find(s => s.el === t) ? selected.slice() : (clearSel(), [{ el: t, word }]);
    setTimeout(() => dragItems.forEach(s => s.el.classList.add('dragging')), 0);
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', word);
  });
  t.addEventListener('dragend', () => dragItems.forEach(s => s.el.classList.remove('dragging')));
  document.getElementById('token-pool').appendChild(t);
}

function makeCellTok(word) {
  const t = document.createElement('span');
  t.className = 'cell-token'; t.textContent = word; t.dataset.word = word; t.draggable = true;
  t.addEventListener('click', e => { e.stopPropagation(); toggleSel(t, word); });
  t.addEventListener('touchstart', () => { longPressTimer = setTimeout(() => { selected = selected.filter(s => s.el !== t); updateUI(); t.parentElement && t.parentElement.removeChild(t); addToPool(word); }, 600); }, { passive: true });
  t.addEventListener('touchend', () => clearTimeout(longPressTimer));
  t.addEventListener('touchmove', () => clearTimeout(longPressTimer));
  t.addEventListener('dragstart', e => {
    dragItems = selected.length && selected.find(s => s.el === t) ? selected.slice() : (clearSel(), [{ el: t, word }]);
    setTimeout(() => dragItems.forEach(s => s.el.classList.add('dragging')), 0);
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', word);
  });
  t.addEventListener('dragend', () => dragItems.forEach(s => s.el.classList.remove('dragging')));
  return t;
}

function placeInCell(inner, items) {
  items.forEach(({ el, word }) => { el.parentElement && el.parentElement.removeChild(el); inner.appendChild(makeCellTok(word)); });
  selected = []; dragItems = []; updateUI();
}

function moveSel(dir) {
  if (!selected.every(s => s.el.classList.contains('cell-token'))) return;
  const loc = getTokenLoc(selected[0].el); if (!loc) return;
  let { rowIdx: ri, col } = loc;
  if (dir === 'up') ri--; else if (dir === 'down') ri++;
  else if (dir === 'left') col = 'left'; else col = 'right';
  const target = getCellInner(ri, col); if (!target) return;
  const items = selected.slice();
  items.forEach(({ el }) => el.parentElement && el.parentElement.removeChild(el));
  selected = [];
  items.forEach(({ word }) => { const t = makeCellTok(word); target.appendChild(t); selected.push({ el: t, word }); t.classList.add('selected'); });
  updateUI();
}

function makeCell(col) {
  const td = document.createElement('td'); td.className = col + '-col';
  const inner = document.createElement('div'); inner.className = 'cell-inner'; td.appendChild(inner);
  inner.addEventListener('click', e => { if (selected.length) { e.stopPropagation(); placeInCell(inner, selected.slice()); } });
  inner.addEventListener('dragover', e => { e.preventDefault(); inner.classList.add('drag-over'); });
  inner.addEventListener('dragleave', () => inner.classList.remove('drag-over'));
  inner.addEventListener('drop', e => { e.preventDefault(); inner.classList.remove('drag-over'); if (dragItems.length) placeInCell(inner, dragItems.slice()); });
  return td;
}

function makeRow() { const tr = document.createElement('tr'); tr.appendChild(makeCell('left')); tr.appendChild(makeCell('right')); return tr; }
function buildRows(n) { const tb = document.getElementById('diagram-body'); tb.innerHTML = ''; for (let i = 0; i < n; i++) tb.appendChild(makeRow()); }

document.getElementById('move-up').addEventListener('click', () => moveSel('up'));
document.getElementById('move-down').addEventListener('click', () => moveSel('down'));
document.getElementById('move-left').addEventListener('click', () => moveSel('left'));
document.getElementById('move-right').addEventListener('click', () => moveSel('right'));
document.getElementById('add-row-end').addEventListener('click', () => { document.getElementById('diagram-body').appendChild(makeRow()); rowCount++; });
document.getElementById('insert-row-above').addEventListener('click', () => {
  const ri = getSelRowIdx(); if (ri < 0) return;
  document.getElementById('diagram-body').insertBefore(makeRow(), getRows()[ri]); rowCount++;
});
document.getElementById('delete-row').addEventListener('click', () => {
  const ri = getSelRowIdx(); if (ri < 0) return;
  const tr = getRows()[ri];
  tr.querySelectorAll('.cell-token').forEach(t => { selected = selected.filter(s => s.el !== t); addToPool(t.dataset.word); });
  tr.parentElement.removeChild(tr); rowCount = Math.max(0, rowCount - 1); updateUI();
});
document.addEventListener('click', e => { if (!e.target.closest('.token,.cell-token,.cell-inner,.action-bar,.row-controls')) clearSel(); });
document.getElementById('return-btn').addEventListener('click', () => { selected.slice().forEach(({ el, word }) => { el.parentElement && el.parentElement.removeChild(el); addToPool(word); }); selected = []; updateUI(); });
document.getElementById('desel-btn').addEventListener('click', clearSel);
document.getElementById('parse-btn').addEventListener('click', () => {
  const text = document.getElementById('text-input').value.trim(); if (!text) return;
  const raw = text.match(/[a-zA-Z]+(?:['’‘][a-zA-Z]+)*|[^\s\w]|\S+/g) || [];
  const words = [];
  raw.forEach(w => {
    const m = w.match(/^([a-zA-Z]+)(['’‘][a-zA-Z]+)$/);
    if (m) { words.push(m[1]); words.push(m[2]); }
    else words.push(w);
  });
  document.getElementById('token-pool').innerHTML = ''; clearSel(); words.forEach(w => addToPool(w)); buildRows(rowCount = 8);
});
document.getElementById('tsv-copy').addEventListener('click', () => {
  const rows = getRows();
  const lines = rows.map(tr => {
    const left = Array.from(tr.cells[0].querySelectorAll('.cell-token')).map(t => t.dataset.word).join(' ');
    const right = Array.from(tr.cells[1].querySelectorAll('.cell-token')).map(t => t.dataset.word).join(' ');
    return left + '\t' + right;
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => alert('TSVをコピーしました'));
});
document.getElementById('clear-all').addEventListener('click', () => { document.getElementById('token-pool').innerHTML = ''; document.getElementById('text-input').value = ''; clearSel(); buildRows(rowCount = 8); });
buildRows(rowCount);
</script>
</body>
</html>
